{% if match.status == "ready" %}
    <form method="post" action="{% url 'recipes:cook' recipe.pk %}" class="m-0">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary {{ button_class }}"><i class="ti ti-chef-hat"></i>Приготував це</button>
    </form>
    <p class="text-secondary small mb-0 d-none d-lg-block">Інгредієнти буде списано з холодильника, а калорії додано в журнал.</p>
{% else %}
    <button type="button" class="btn btn-primary {{ button_class }}" disabled><i class="ti ti-chef-hat"></i>Приготував це</button>
    <p class="text-secondary small mb-0 d-none d-lg-block">
        Спершу додай: {% for item in match.lacking %}{{ item.product.name }}{% if not forloop.last %}, {% endif %}{% endfor %}
    </p>
{% endif %}
