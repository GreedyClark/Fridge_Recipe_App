{% extends "base.html" %}

{% block title %}Видалити продукт · Fridge Recipe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body p-4 p-md-5 d-flex flex-column gap-3">
                <span class="empty-icon text-danger"><i class="ti ti-trash"></i></span>
                <h1 class="h2 mb-0">Видалити продукт?</h1>
                <p class="text-secondary mb-0">
                    З холодильника буде видалено <strong class="text-body">{{ item.quantity|floatformat:"-2" }} {{ item.unit }} {{ item.product.name }}</strong>.
                </p>
                <form method="post" class="d-flex flex-wrap gap-2 mt-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="ti ti-trash"></i>Видалити</button>
                    <a href="{% url 'fridge:list' %}" class="btn btn-ghost">Скасувати</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
