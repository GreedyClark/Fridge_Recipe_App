{% extends "registration/auth_base.html" %}

{% block title %}Вхід · Fridge Recipe{% endblock %}

{% block form %}
<h2 class="mb-1">Вхід</h2>
<p class="text-secondary mb-4">Раді бачити знову</p>
<form method="post" novalidate class="d-flex flex-column gap-3">
    {% csrf_token %}
    {% include "registration/_form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Увійти</button>
</form>
<p class="text-center text-secondary mt-4 mb-0">
    Немає акаунта? <a href="{% url 'signup' %}" class="fw-bold text-decoration-none">Зареєструватися</a>
</p>
{% endblock %}
