{% extends "registration/auth_base.html" %}

{% block title %}Реєстрація · Fridge Recipe{% endblock %}

{% block form %}
<h2 class="mb-1">Реєстрація</h2>
<p class="text-secondary mb-4">Займе менше хвилини</p>
<form method="post" novalidate class="d-flex flex-column gap-3">
    {% csrf_token %}
    {% include "registration/_form_fields.html" %}
    <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Створити акаунт</button>
</form>
<p class="text-center text-secondary mt-4 mb-0">
    Вже є акаунт? <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Увійти</a>
</p>
{% endblock %}
